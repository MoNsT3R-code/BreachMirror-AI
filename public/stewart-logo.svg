<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="100%" height="100%">
  <defs>
    <style>
      .stewart-burgundy { fill: #9B2743; }
      .stewart-dark { fill: #1E2229; }
      .stewart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 50px; letter-spacing: -1.2px; }
      .stewart-tm { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 10px; }
    </style>
  </defs>

  <!-- Stewart Emblem: 3 Slanted Burgundy Stripes with Rooftop Gable -->
  <g transform="translate(6, 4)">
    <!-- Stripe 1 (Left - Burgundy) -->
    <polygon class="stewart-burgundy" points="10,65 24,65 42,17 28,17" />

    <!-- Stripe 2 (Middle - Burgundy) -->
    <polygon class="stewart-burgundy" points="29,65 43,65 61,17 47,17" />

    <!-- Stripe 3 (Right - Burgundy base) -->
    <polygon class="stewart-burgundy" points="48,65 62,65 73,36 61,36" />

    <!-- Stripe 3 Gable / Rooftop Peak (Dark Charcoal / Black) -->
    <path class="stewart-dark" d="M 64,17 L 83,17 L 97,44 L 84,44 L 75,27 L 69,27 L 60,49 L 55,49 Z" />
  </g>

  <!-- Wordmark: stewart™ -->
  <text x="116" y="55" class="stewart-dark stewart-text">stewart</text>
  <text x="306" y="27" class="stewart-dark stewart-tm">TM</text>
</svg>
