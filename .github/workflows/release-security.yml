name: Release security

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate release manifest
        run: sha256sum package.json package-lock.json > release-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-manifest.sha256
